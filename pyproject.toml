[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smolagents-outlines"
version = "0.1.0"
description = "Schema-constrained tool actions for smolagents using Outlines"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris McComb" }]
keywords = ["agents", "outlines", "smolagents", "structured-generation", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "smolagents==1.26.0",
    "outlines[transformers]==1.3.3",
    "transformers==4.57.1",
    "accelerate==1.11.0",
    "jsonschema>=4.23,<5",
    "PyYAML>=6,<7",  # smolagents 1.26.0 imports yaml for native prompts.
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "mypy>=1.15,<2"]

[project.urls]
Repository = "https://github.com/cmccomb/smolagents-outlines"
Issues = "https://github.com/cmccomb/smolagents-outlines/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smolagents_outlines = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
